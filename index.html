<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turritopsis</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="intro-splash" aria-hidden="true">
      <p data-testid="intro" class="intro-line">If you could start over, would you?</p>
    </div>

    <div class="particles" aria-hidden="true"></div>

    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>The Immortal Jellyfish</h1>

      <svg
        id="jelly-scene"
        viewBox="0 0 400 400"
        role="img"
        aria-label="An animated jellyfish that ages a step each time you press the button below, from a small anchored polyp through youth and maturity to old age."
      >
        <defs>
          <radialGradient id="bioGradient" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#eafcff" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#59e8d0" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#0b3d55" stop-opacity="0" />
          </radialGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur id="glowBlur" in="SourceGraphic" stdDeviation="3" result="blur" />
            <feColorMatrix
              in="blur"
              type="matrix"
              values="1.4 0 0 0 0  0 1.4 0 0 0  0 0 1.4 0 0  0 0 0 1 0"
              result="bloom"
            />
            <feMerge>
              <feMergeNode in="bloom" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="organic" x="-60%" y="-60%" width="220%" height="220%">
            <feTurbulence type="fractalNoise" baseFrequency="0.015 0.05" numOctaves="2" seed="7" result="noise" />
            <feDisplacementMap
              id="organicDisplace"
              in="SourceGraphic"
              in2="noise"
              scale="2"
              xChannelSelector="R"
              yChannelSelector="G"
            />
          </filter>
          <filter id="ripple" x="-100%" y="-100%" width="300%" height="300%">
            <feTurbulence type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="2" seed="3" result="rippleNoise" />
            <feDisplacementMap in="SourceGraphic" in2="rippleNoise" xChannelSelector="R" yChannelSelector="G" scale="0">
              <animate
                id="rippleAnim"
                attributeName="scale"
                values="0;55;0"
                keyTimes="0;0.4;1"
                dur="420ms"
                begin="indefinite"
                fill="remove"
              />
            </feDisplacementMap>
          </filter>
        </defs>

        <!-- ouroboros: dormant ring, drawn only around a loop-reset -->
        <circle
          id="ouroboros-ring"
          cx="200"
          cy="200"
          r="170"
          fill="none"
          stroke="url(#bioGradient)"
          stroke-width="3"
          stroke-dasharray="1068.14"
          stroke-dashoffset="1068.14"
          opacity="0"
        />

        <!-- polyp: anchored stalk with a short tentacle crown -->
        <g class="stage" data-stage="polyp" fill="url(#bioGradient)">
          <ellipse cx="200" cy="330" rx="26" ry="8" opacity="0.5" />
          <path d="M 190 260 Q 186 300 192 328 L 208 328 Q 214 300 210 260 Z" />
          <g class="tentacles" filter="url(#organic)">
            <path d="M 190 262 Q 178 248 170 252" fill="none" stroke="url(#bioGradient)" stroke-width="4" stroke-linecap="round" />
            <path d="M 196 258 Q 190 240 182 240" fill="none" stroke="url(#bioGradient)" stroke-width="4" stroke-linecap="round" />
            <path d="M 204 258 Q 210 240 218 240" fill="none" stroke="url(#bioGradient)" stroke-width="4" stroke-linecap="round" />
            <path d="M 210 262 Q 222 248 230 252" fill="none" stroke="url(#bioGradient)" stroke-width="4" stroke-linecap="round" />
          </g>
        </g>

        <!-- young medusa: small bell, thin sparse tentacles -->
        <g class="stage" data-stage="young" fill="url(#bioGradient)">
          <path d="M 160 190 Q 160 130 200 128 Q 240 130 240 190 Q 200 210 160 190 Z" />
          <g class="tentacles" filter="url(#organic)">
            <path d="M 175 195 Q 170 250 165 290" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 190 202 Q 187 260 182 300" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 210 202 Q 213 260 218 300" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 225 195 Q 230 250 235 290" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
          </g>
        </g>

        <!-- mature medusa: full bell, oral arms, many tentacles -->
        <g class="stage" data-stage="mature" fill="url(#bioGradient)">
          <path d="M 130 200 Q 128 110 200 105 Q 272 110 270 200 Q 200 232 130 200 Z" />
          <g class="oral-arms" filter="url(#organic)">
            <path d="M 185 210 Q 180 250 190 280" fill="none" stroke="url(#bioGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
            <path d="M 200 214 Q 200 255 200 290" fill="none" stroke="url(#bioGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
            <path d="M 215 210 Q 220 250 210 280" fill="none" stroke="url(#bioGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
          </g>
          <g class="tentacles" filter="url(#organic)">
            <path d="M 145 205 Q 135 270 125 330" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 160 215 Q 153 280 145 335" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 175 222 Q 170 285 165 340" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 225 222 Q 230 285 235 340" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 240 215 Q 247 280 255 335" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
            <path d="M 255 205 Q 265 270 275 330" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" />
          </g>
        </g>

        <!-- senescent: shrunken, asymmetric, drooping -->
        <g class="stage" data-stage="senescent" fill="url(#bioGradient)">
          <path d="M 150 210 Q 152 150 198 140 Q 250 148 245 205 Q 195 225 150 210 Z" />
          <g class="tentacles" filter="url(#organic)">
            <path d="M 165 212 Q 158 245 168 270" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
            <path d="M 190 218 Q 186 250 195 275" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
            <path d="M 222 216 Q 228 248 220 272" fill="none" stroke="url(#bioGradient)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
          </g>
        </g>
      </svg>

      <p id="current-stage-label" class="current-stage-label" aria-live="polite">Polyp</p>

      <div class="controls">
        <button id="next-stage" type="button" class="primary-button">Let time pass</button>
        <button
          id="info-toggle"
          type="button"
          class="info-button"
          aria-haspopup="dialog"
          aria-controls="stage-info"
          aria-label="More about this stage"
        >
          &#9432;
        </button>
      </div>

      <dialog id="stage-info" aria-labelledby="stage-info-title">
        <button id="stage-info-close" type="button" class="dialog-close" aria-label="Close">&times;</button>
        <h2 id="stage-info-title">Polyp</h2>
        <div class="reference-photo" aria-hidden="true"><span>Reference photo -- placeholder</span></div>
        <p id="stage-info-detail"></p>
      </dialog>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
